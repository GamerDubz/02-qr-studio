<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="qrGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#qrGrad)" />
  <!-- Inner dark card -->
  <rect x="5" y="5" width="22" height="22" rx="5" fill="#064E3B" />
  
  <!-- QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left -->
  <rect x="8" y="8" width="6" height="6" rx="1.5" fill="#34D399" />
  <rect x="9.5" y="9.5" width="3" height="3" rx="0.8" fill="#064E3B" />
  <rect x="10.5" y="10.5" width="1" height="1" fill="#FFFFFF" />

  <!-- Top-Right -->
  <rect x="18" y="8" width="6" height="6" rx="1.5" fill="#34D399" />
  <rect x="19.5" y="9.5" width="3" height="3" rx="0.8" fill="#064E3B" />
  <rect x="20.5" y="10.5" width="1" height="1" fill="#FFFFFF" />

  <!-- Bottom-Left -->
  <rect x="8" y="18" width="6" height="6" rx="1.5" fill="#34D399" />
  <rect x="9.5" y="19.5" width="3" height="3" rx="0.8" fill="#064E3B" />
  <rect x="10.5" y="20.5" width="1" height="1" fill="#FFFFFF" />

  <!-- Pixel bits forming a Q tail -->
  <rect x="16" y="16" width="2.5" height="2.5" rx="0.6" fill="#6EE7B7" />
  <rect x="20" y="16" width="2.5" height="2.5" rx="0.6" fill="#A7F3D0" />
  <rect x="16" y="20" width="2.5" height="2.5" rx="0.6" fill="#A7F3D0" />
  <rect x="20" y="20" width="4" height="4" rx="1" fill="#34D399" />
  <rect x="22" y="22" width="2.5" height="2.5" rx="0.6" fill="#FFFFFF" />
</svg>
